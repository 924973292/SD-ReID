MODEL:
  META_ARCHITECTURE: Baseline_stage1_3view

  PIXEL_MEAN: [127.5, 127.5, 127.5]
  PIXEL_STD: [127.5, 127.5, 127.5]

  BACKBONE:
#    NAME:  build_vit_sub
    NAME:  build_vit_prompt


    DEPTH: base
    FEAT_DIM: 768
    PRETRAIN: True
    PRETRAIN_PATH: "pretrained/jx_vit_base_p16_224-80ecf9dd.pth"

    STRIDE_SIZE: (16, 16)
    DROP_PATH_RATIO: 0.1
    DROP_RATIO: 0.0
    ATT_DROP_RATE: 0.0
    INNER_SUB: True

  SDMODEL:
    U_COND_PERCENT: 0.05
    VIEW_NUM: 3
    MOEMNTUM: 0.8

    FIRST_STAGE_CONFIG:
      PRETRAINED_PATH: "pretrained/stable-diffusion-v1-5/vae"

    UNET_CONFIG:
      PRETRAINED_PATH: "pretrained/stable-diffusion-v1-5/unet"

    SCHEDULER_CONFIG:
      PRETRAINED_PATH: "pretrained/stable-diffusion-v1-5/scheduler"
      CUBIC_SAMPLING: True

    CON_LEARNER_CONFIG:
      N_CTX: 12
      CTX_DIM: 768

  HEADS:
    NAME: EmbeddingHead
    NORM: BN
    WITH_BNNECK: True
    POOL_LAYER: Identity
    NECK_FEAT: before
    CLS_LAYER: Linear

  LOSSES:
    NAME: ("CrossEntropyLoss", "TripletLoss",)

    CE:
      EPSILON: 0.
      SCALE: 1.
      # view-related learning
      VIEW_ID: True
      VIEW_OREG: True
      VIEW_LAMBDA: 0.001

    TRI:
      MARGIN: 0.0
      HARD_MINING: True
      NORM_FEAT: False
      SCALE: 1.



INPUT:
  SIZE_TRAIN: [ 256, 128 ]
  SIZE_TEST: [ 256, 128 ]

  REA:
    ENABLED: True
    PROB: 0.5

  FLIP:
    ENABLED: True

  PADDING:
    ENABLED: True

DATALOADER:
  SAMPLER_TRAIN: NaiveIdentitySampler
#  SAMPLER_TRAIN: AGSampler

  NUM_INSTANCE: 8  # 8
  NUM_WORKERS: 14

SOLVER:
  AMP:
    ENABLED: True

  CLIP_GRADIENTS:
    ENABLED: True

  MAX_EPOCH: 120

  CHECKPOINT_PERIOD: 5

  IMS_PER_BATCH: 256  # 256

  OPT: SGD
  BASE_LR: 0.008
  WEIGHT_DECAY: 0.0001

  SCHED: CosineAnnealingLR
  ETA_MIN_LR: 0.0000016

  WARMUP_FACTOR: 0.01
  WARMUP_ITERS: 2000

TEST:
  EVAL_PERIOD: 5
  IMS_PER_BATCH:  1024

CUDNN_BENCHMARK: True

DATASETS:
  NAMES: ('AG_ReID_v2',)
  TESTS: ('AG_ReID_v2_AC','AG_ReID_v2_AW','AG_ReID_v2_CA','AG_ReID_v2_WA')

OUTPUT_DIR: logs/v2/base_stage1_beta
